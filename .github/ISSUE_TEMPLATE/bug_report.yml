name: Bug report
description: Something in Schema Studio or the shared packages doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! **Issues are public.** Don't paste customer data, personal data, credentials or tokens; replace them with `example.com` and invented names. Security problems go to [private vulnerability reporting](https://github.com/Johnny050033/truelink-schema-web-tools/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Choose the … template
        3. Enter …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Schema Studio in the browser
        - Schema Studio installed as an app (PWA)
        - truelink-schema-document (shared core package)
        - truelink-schema-cloud (host bridge package)
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - English
        - 繁體中文
        - 简体中文
        - 日本語
        - Español
        - Português (Brasil)
        - Bahasa Indonesia
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: e.g. Chrome 140 on Windows 11, Safari on iOS 19
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings → About.
  - type: textarea
    id: sample
    attributes:
      label: JSON-LD sample (synthetic only)
      description: A minimal example that shows the problem, if relevant.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed any private or customer data from this report.
          required: true
