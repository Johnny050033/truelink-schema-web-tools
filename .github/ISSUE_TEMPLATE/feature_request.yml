name: Feature or improvement idea
description: Suggest a feature, a better workflow or a new check.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or job to be done, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Your idea for how Schema Studio could support this.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to Google Search Central, Schema.org or other documentation, if any.
  - type: dropdown
    id: role
    attributes:
      label: You are mostly a …
      options:
        - SEO / marketing professional
        - Developer
        - Agency
        - Business owner
        - Other
