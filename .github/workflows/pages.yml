# Publishes the standalone Schema Studio (local-only: no TrueLink host, no cloud drafts) to
# GitHub Pages on every push to main, as the public demo linked from the README.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Until Pages is switched on, skip the deployment with a notice instead of failing on main.
  pages-enabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPOSITORY}/pages")
          case "$code" in
            200) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
            404)
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo '::notice title=GitHub Pages is off::Enable it in Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow.'
              ;;
            *) echo "::error::Unexpected HTTP ${code} while checking GitHub Pages"; exit 1 ;;
          esac

  build:
    needs: pages-enabled
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter truelink-schema-studio check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
