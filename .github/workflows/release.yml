# Publishes versioned build artifacts when a tag like v0.3.0 is pushed, so every TrueLink
# tool can pin the same shared core and be updated automatically (see
# docs/PLATFORM_STRATEGY.zh-TW.md, "一處更新、全部同步").
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - name: Check the tag matches the shared core version
        run: |
          core=$(node -p "require('./packages/schema-document/package.json').version")
          test "v${core}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match truelink-schema-document ${core}"; exit 1; }
      - name: Collect artifacts
        run: |
          mkdir -p release
          cp packages/schema-document/dist/bundles/truelink-schema-document.global.js release/
          cp packages/schema-document/dist/bundles/truelink-schema-document.mjs release/
          cp packages/schema-document/dist/bundles/truelink-schema-document.cjs release/
          cp packages/cloud-client/dist/bundles/truelink-schema-cloud.global.js release/
          cp packages/cloud-client/dist/bundles/truelink-schema-cloud.mjs release/
          cp packages/schema-document/conformance/legacy-store.json release/conformance-legacy-store.json
          for file in packages/schema-document/locales/*.json; do cp "$file" "release/truelink-schema-document.locale.$(basename "$file")"; done
          (cd packages/schema-document && pnpm pack --pack-destination ../../release)
          (cd packages/cloud-client && pnpm pack --pack-destination ../../release)
          (cd apps/web/dist && tar -czf ../../../release/schema-studio-standalone-${GITHUB_REF_NAME}.tar.gz .)
          (cd release && sha256sum * > SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "${GITHUB_REF_NAME}" --notes "Shared core (browser builds, npm tarballs, translation catalogs, conformance cases), host-bridge client and a standalone Schema Studio build for ${GITHUB_REF_NAME}. TrueLink deployments rebuild the Studio from this tag with their own VITE_TRUELINK_* settings. Verify files with SHA256SUMS."
